<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRCHND</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1d; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<div id="scene"></div>

<script>
new p5((p) => {
  const BG     = [26, 26, 29];
  const TINT   = [225, 228, 235];
  const ALPHA  = 9;
  const POINTS = 5500;
  const DT     = 0.055;
  const DAMP   = 0.0042;
  const DRIFT  = 0.0022;
  const F      = [2.01, 3.0, 3.0, 2.01];
  const INNER  = 0.42;

  let R, cx, cy, phase = 0;

  function layout() {
    cx = p.width / 2;
    cy = p.height / 2;
    R = Math.min(p.width, p.height) * 0.2;
  }

  p.setup = () => {
    p.createCanvas(p.windowWidth, p.windowHeight);
    layout();
    p.strokeWeight(1);
    p.noFill();
  };

  p.windowResized = () => {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
    layout();
  };

  function trace(scale, mirror, dir, rot) {
    const p1 = dir * phase, p2 = dir * phase * 0.7;
    const p3 = -dir * phase * 0.5, p4 = dir * phase * 1.3;
    const cosr = Math.cos(rot), sinr = Math.sin(rot);

    let px = null, py = null;
    for (let i = 0; i < POINTS; i++) {
      const t = i * DT;
      const env = Math.exp(-DAMP * t);
      const x = (Math.sin(F[0] * t + p1) + Math.sin(F[1] * t + p2)) * env;
      const y = (Math.sin(F[2] * t + p3) + Math.sin(F[3] * t + p4)) * env * mirror;
      const rx = x * cosr - y * sinr;
      const ry = x * sinr + y * cosr;
      const sx = cx + rx * scale;
      const sy = cy + ry * scale;
      if (px !== null) p.line(px, py, sx, sy);
      px = sx; py = sy;
    }
  }

  p.draw = () => {
    p.background(BG[0], BG[1], BG[2]);
    p.stroke(TINT[0], TINT[1], TINT[2], ALPHA);

    trace(R, 1, 1, 0);
    trace(R, -1, 1, 0);

    const innerRot = phase * 0.25;
    trace(R * INNER, 1, -1, innerRot);
    trace(R * INNER, -1, -1, innerRot);

    phase += DRIFT;
  };
}, 'scene');
</script>
</body>
</html>
